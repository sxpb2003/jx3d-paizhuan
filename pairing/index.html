const tabs=document.getElementById('tabs'), listEl=document.getElementById('list'),
      stage=document.getElementById('stage'), legendEl=document.getElementById('legend'), sumEl=document.getElementById('sum');
let model='u2', cur=null;

const colorOf = id => 'hsl(' + ((id*47)%360) + ',42%,72%)';

function render(w){
  cur=w;
  const x0=Math.min(...w.blocks.map(b=>b[0])), x1=Math.max(...w.blocks.map(b=>b[1]));
  const ys=[...new Set(w.blocks.map(b=>b[2]))].sort((a,b)=>a-b);
  const W=1000, padL=42, padR=14, padT=14, padB=26;
  const s=Math.min((W-padL-padR)/(x1-x0), 600/(ys.length*300));
  const H=padT+ys.length*300*s+padB;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  for(const b of w.blocks){
    const [bs,be,by,L,brick]=b;
    const px=padL+(bs-x0)*s, py=padT+(ys.length-ys.indexOf(by)-1)*300*s;
    svg+='<rect x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" width="'+Math.max(1,(be-bs)*s-1.3).toFixed(1)+
         '" height="'+(300*s-1.3).toFixed(1)+'" fill="'+colorOf(brick)+'" stroke="#6b7280" stroke-width="0.6"/>';
    if((be-bs)*s>24) svg+='<text x="'+(px+(be-bs)*s/2).toFixed(1)+'" y="'+(py+300*s/2+4).toFixed(1)+
         '" font-size="10.5" fill="#1f2937" text-anchor="middle">'+L+'</text>';
  }
  ys.forEach((y,i)=>{ const py=padT+(ys.length-1-i)*300*s;
    svg+='<text x="'+(padL-5)+'" y="'+(py+300*s/2+4).toFixed(1)+'" font-size="9.5" fill="#6b7280" text-anchor="end">'+(i+1)+'</text>'; });
  svg+='</svg>';
  stage.innerHTML=svg;

  let lg='<div style="color:#6b7280;margin-bottom:6px">砖号 → 切出（长度·第几皮）</div>';
  for(const [brick,pieces] of w.legend)
    lg+='<div class="li"><span class="sw" style="background:'+colorOf(brick)+'"></span><span>Q'+brick+'：'+
        pieces.map(p=>p[0]+'（第'+p[1]+'皮）').join(' + ')+'</span></div>';
  if(w.residues.length)
    lg+='<div class="res">余料无处可用：'+w.residues.map(r=>r[0]+'（Q'+r[1]+'）').join('、')+'</div>';
  legendEl.innerHTML=lg;

  const res=w.residues.reduce((t,r)=>t+r[0],0), used=w.legend.length;
  sumEl.textContent='这面墙 '+w.blocks.length+' 块 · 用砖 '+used+' 根 · 余料 '+res+'mm（'+(res/(used*600)*100).toFixed(1)+'%）';
  [...listEl.children].forEach(b=>b.classList.toggle('on', b.dataset.id===w.id));
}

function loadModel(m){
  model=m;
  const ws=DATA[m].walls, st=DATA[m].stat;
  sumEl.textContent='共 '+ws.length+' 面墙 · '+st.blk+' 块 · 用砖 '+st.used+' 根 · 余料 '+
    (st.res/1000).toFixed(1)+'m（'+(st.res/(st.used*600)*100).toFixed(2)+'%）';
  listEl.innerHTML='';
  ws.forEach(w=>{
    const b=document.createElement('button');
    b.dataset.id=w.id; b.textContent=w.id+' · 长'+w.len+' · '+w.blocks.length+'块';
    b.onclick=()=>render(w);
    listEl.appendChild(b);
  });
  [...tabs.children].forEach(t=>t.classList.toggle('on', t.dataset.m===m));
  render(ws[Math.floor(ws.length/2)]);
}

['u1','u2','u3','u4'].forEach(m=>{
  const t=document.createElement('button');
  t.dataset.m=m; t.textContent=m.toUpperCase();
  t.onclick=()=>loadModel(m);
  tabs.appendChild(t);
});
loadModel('u2');
