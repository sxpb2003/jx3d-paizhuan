<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="description" content="住宅楼砌体排砖三维模型 · 按层展示 · 楼层筛选 / 类别开关 / 剖切">
<title>住宅楼 · 砌体排砖三维展示</title>
<link rel="stylesheet" href="../common/viewer.css">
<script>
/* 部署在 GitHub Pages 时自动跳转到正式站点（sxhicc.cn/paizhuan/）；本地/COS/正式域名下正常渲染 */
(function () {
  try {
    if (!/(^|\.)github\.io$/i.test(location.hostname)) return;
    var m = location.pathname.match(/^\/jx3d-paizhuan(\/.*)?$/);
    var p = (m && m[1]) ? m[1] : '/';
    location.replace('https://sxhicc.cn/paizhuan' + p + location.search + location.hash);
  } catch (e) { /* ignore */ }
})();
</script></head>
<body>
<div id="app"></div>

<script>
  window.VIEWER_CONFIG = {
    manifest: 'model.json',
    // 住宅楼：只显示 8.950 这一层（不提供楼层选择），并且默认不显示楼板
    fixedFloor: 'F02',
    hideFloorPanel: true,
    categoriesOff: ['B', 'Q', 'L', 'M', 'W', 'G'],
    footer: { rvt: '打印交付版排砖总文件常规模型+结构+门窗-备份文件-2026-7-25构造柱更新-2024revit.rvt' }
  };
</script>

<script type="importmap">
  { "imports": { "three": "../lib/three.module.js" } }
</script>

<!-- 先取 version.txt 再加载 viewer.js：避免 CDN 缓存旧脚本（js 缓存 24 小时） -->
  <script>
  (async function () {
    let v = '';
    try {
      const r = await fetch('../version.txt?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) v = (await r.text()).trim();
    } catch (e) { /* ignore */ }
    const s = document.createElement('script');
    s.type = 'module';
    s.src = '../common/viewer.js' + (v ? ('?v=' + encodeURIComponent(v)) : '');
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
