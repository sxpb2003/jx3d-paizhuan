const TOTAL = 180;
const q = new URLSearchParams(location.search);
const f = parseInt(q.get('f')||'0',10);
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setSize(W,H); renderer.setPixelRatio(1); renderer.setClearColor(0x0b1420,1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff,1.05));
const l1 = new THREE.DirectionalLight(0xffffff,1.5); l1.position.set(3,4,2); scene.add(l1);
const l2 = new THREE.DirectionalLight(0xffffff,0.6); l2.position.set(-3,2,-2); scene.add(l2);

const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color:0xffffff}), B.length);
const c1 = new THREE.Color();
B.forEach((b,i)=>{
  if (b[7]) c1.setHex(0xf2a33c);        // 配对切块：橙
  else if (b[6]) c1.setHex(0xe9dcc0);   // 整块：米
  else c1.setHex(0xa9b3c4);             // 单独切块：灰蓝
  mesh.setColorAt(i,c1);
});
scene.add(mesh);
const idx = B.map((b,i)=>i).sort((a,b)=> B[a][1]-B[b][1] || B[a][0]-B[b][0]);
const zero = new THREE.Matrix4().makeScale(0,0,0);
const m4 = new THREE.Matrix4();
B.forEach((b,i)=> mesh.setMatrixAt(i, zero));

let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,minZ=1e9,maxZ=-1e9;
B.forEach(b=>{ minX=Math.min(minX,b[0]);maxX=Math.max(maxX,b[0]);minY=Math.min(minY,b[1]);maxY=Math.max(maxY,b[1]);minZ=Math.min(minZ,b[2]);maxZ=Math.max(maxZ,b[2]); });
const cx=(minX+maxX)/2, cy=(minY+maxY)/2, cz=(minZ+maxZ)/2;
const sx=maxX-minX, sy=maxY-minY, sz=maxZ-minZ;
const fov = 40*Math.PI/180;
const radius = (Math.max(sx,sy,sz)/2)/Math.tan(fov/2)*1.02;

const frac = Math.min(1, f/(TOTAL*0.72));
const n = Math.max(1, Math.round(idx.length*frac));
for (let k=0;k<n;k++){ const i=idx[k], b=B[i]; m4.makeScale(b[3],b[4],b[5]).setPosition(b[0],b[1],b[2]); mesh.setMatrixAt(i,m4); }
mesh.instanceMatrix.needsUpdate = true;
if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

const ang = -0.95 + (f/TOTAL)*0.45;
const cam = new THREE.PerspectiveCamera(40, W/H, 0.1, 2000);
cam.position.set(cx + Math.sin(ang)*radius, cy + radius*0.6, cz + Math.cos(ang)*radius);
cam.lookAt(cx, cy - sy*0.04, cz);
renderer.render(scene, cam);

// 流程高亮（按进度）
const stage = frac < 0.18 ? 1 : frac < 0.45 ? 2 : frac < 0.68 ? 3 : frac < 0.9 ? 4 : 5;
for (let s=1;s<=5;s++){ const el=document.getElementById('p'+s); if(!el) continue;
  el.className = 'step' + (s<stage?' done':(s===stage?' on':'')); }
const pairedN = B.filter(b=>b[7]).length;
document.getElementById('cnt').innerHTML =
 '<span class="k">已砌</span> <b>'+n+'</b> <span class="k">/ '+B.length+' 块</span><br>'+
 '<span class="k">其中来自配对余料</span> <b>'+Math.round(pairedN*frac)+'</b> <span class="k">块</span><br>'+
 '<span class="k">同色即同一块砖</span>';
document.title = 'READY ' + n;
</script></body></html>
